name: Reportar un bug
description: Comportamiento incorrecto y reproducible en Web o Desktop.
title: "bug: "
labels: [bug]
body:
  - type: dropdown
    id: variant
    attributes:
      label: Variante
      options:
        - Web
        - Desktop macOS
        - Desktop Windows
        - Ambas
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Contá qué ocurrió y qué esperabas que ocurriera.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir...
        2. Seleccionar...
        3. Aplicar...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: v2.0.0 o hash del commit

  - type: input
    id: environment
    attributes:
      label: Sistema y navegador
      placeholder: macOS 15, Apple Silicon, Chrome 140

  - type: textarea
    id: evidence
    attributes:
      label: Evidencia adicional
      description: Capturas, video o un archivo mínimo sin información privada.

  - type: checkboxes
    id: checks
    attributes:
      label: Verificación
      options:
        - label: Busqué reportes duplicados.
          required: true
        - label: El material adjunto no contiene credenciales ni datos privados.
          required: true
